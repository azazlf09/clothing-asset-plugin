<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>服装资产库</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="bar">
    <div class="brand">服装资产库</div>
    <div class="right">
      <span id="serverDot" class="dot" title="反推服务状态"></span>
      <button id="openLib" class="ghost">资产库</button>
    </div>
  </header>

  <div id="serverBanner" class="banner hidden">
    <div class="banner-msg">⚠ 本地反推服务未启动</div>
    <div class="banner-actions">
      <button id="bannerRetry" class="ghost small">重试连接</button>
      <button id="bannerHelp" class="ghost small">如何开启</button>
    </div>
    <div id="bannerHelpBox" class="banner-help hidden">
      已安装开机自启的话，重启电脑即自动运行。<br/>
      若未安装，请双击运行一次：<br/>
      <code>server\scripts\install-autostart.bat</code><br/>
      （安装后开机自动后台启动，无需再手动操作）
    </div>
  </div>

  <main>
    <section class="card single-only">
      <div id="preview" class="preview empty">
        <span class="hint">右键网页图片「反推此服装」<br/>或点下方按钮从页面选图</span>
      </div>
      <div class="row gap">
        <button id="pickBtn" class="secondary">从页面选图</button>
        <button id="multiPickBtn" class="secondary">批量选图</button>
        <button id="clearBtn" class="ghost">清空</button>
      </div>
    </section>

    <section class="card">
      <label class="lbl">反推档位</label>
      <div id="modes" class="segmented">
        <button class="seg on" data-mode="clothing_only">纯服装</button>
        <button class="seg" data-mode="with_model">带模特</button>
        <button class="seg" data-mode="ghost_mannequin">假人展示</button>
        <button class="seg" data-mode="full_scene">反推全图</button>
      </div>
      <label class="langOpt">
        <input type="checkbox" id="langZh" checked />
        <span>输出纯中文提示词（默认）</span>
      </label>
      <label class="langOpt">
        <input type="checkbox" id="tagZh" checked />
        <span>标签用中文（默认）</span>
      </label>
      <div class="single-only">
        <button id="reasonBtn" class="primary block" disabled>反推提示词</button>
        <div id="reasonStatus" class="status"></div>
        <textarea id="promptText" class="prompt" placeholder="反推结果将显示在这里，可编辑…" rows="6"></textarea>
        <div class="row gap prompt-actions">
          <button id="copyPromptBtn" class="secondary" disabled>复制提示词</button>
          <button id="clearPromptBtn" class="ghost" disabled>清除提示词</button>
        </div>
      </div>
    </section>

    <!-- 批量模式 -->
    <section id="batchWrap" class="batch-wrap hidden">
      <div class="batch-header">
        <div class="cnt">批量：<em id="batchCnt">0</em>张 · 完成<em id="batchDone">0</em></div>
        <div class="batch-actions">
          <button id="batchReasonAll" class="primary">一键反推</button>
          <button id="batchCopyAll" class="secondary" disabled>一键复制提示词</button>
          <button id="batchClearAll" class="ghost" disabled>一键清除提示词</button>
          <button id="batchSaveAll" class="secondary" disabled>全部保存</button>
          <button id="batchAdd" class="ghost">+加图</button>
          <button id="batchExit" class="ghost">退出批量</button>
        </div>
      </div>
      <div class="batch-meta">
        <div class="batch-mode-hint">
          将以 <em id="batchCurMode">纯服装</em> 档批量反推
          <span class="sub">（切换上方"反推档位"即变更）</span>
        </div>
        <label class="batch-conc">
          并发数
          <select id="batchConc" class="sel small">
            <option value="1">1（最稳）</option>
            <option value="2">2</option>
            <option value="3" selected>3（推荐）</option>
            <option value="5">5</option>
            <option value="8">8（最快·CLI 慎用）</option>
          </select>
        </label>
      </div>
      <div id="batchList" class="batch-list"></div>
      <div id="batchStatus" class="status center"></div>
    </section>

    <section class="card single-only">
      <label class="lbl">大类</label>
      <div class="row gap">
        <select id="categorySel" class="sel"></select>
        <input id="newCatInput" class="inp" placeholder="新增大类变量…" />
        <button id="addCatBtn" class="ghost small">+</button>
      </div>

      <label class="lbl mt">标签 <span class="sub">(可多选，Eagle式)</span></label>
      <div id="chosenTags" class="tags chosen"></div>
      <div class="row gap">
        <input id="tagInput" class="inp" placeholder="输入标签回车添加…" />
      </div>
      <div id="suggestTags" class="tags suggest"></div>
    </section>

    <button id="saveBtn" class="primary block save single-only" disabled>保存到资产库</button>
    <div id="saveStatus" class="status center single-only"></div>

    <section class="card">
      <button id="toggleSettings" class="ghost block left">⚙ 反推引擎设置</button>
      <div id="settings" class="settings hidden">
        <label class="lbl">Provider</label>
        <select id="provSel" class="sel block">
          <option value="cli">本地 Claude CLI</option>
          <option value="openai">OpenAI 兼容</option>
          <option value="anthropic">Anthropic</option>
          <option value="gemini">Gemini</option>
        </select>
        <div id="remoteCfg" class="hidden">
          <input id="cfgBase" class="inp block mt" placeholder="baseURL" />
          <input id="cfgKey" class="inp block mt" placeholder="apiKey" type="password" />
          <input id="cfgModel" class="inp block mt" placeholder="model" />
        </div>
        <input id="cfgCliModel" class="inp block mt" placeholder="CLI model(可空，默认)" />
        <button id="saveCfg" class="secondary block mt">保存设置</button>
        <div id="cfgStatus" class="status center"></div>
      </div>
    </section>
  </main>

  <script src="lib/db.js"></script>
  <script src="lib/reason.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
